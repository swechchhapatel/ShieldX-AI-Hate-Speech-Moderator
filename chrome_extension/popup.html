<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>AI Moderator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 250px;
        padding: 15px;
        background: #fafafa;
      }
      h2 {
        text-align: center;
        margin-top: 0;
      }
      button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background-color: #0078d7;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background-color: #005fa3;
      }
      #status {
        margin-top: 10px;
        font-size: 14px;
        text-align: center;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h2>AI Moderator</h2>
    <button id="activateBtn">Activate Moderation</button>
    <button id="deactivateBtn">Deactivate Moderation</button>
    <button id="scanBtn">Scan Now</button>
    <p id="status">Status: <strong>Idle</strong></p>

    <script src="popup.js"></script>
  </body>
</html>
